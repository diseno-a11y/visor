<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visores 3D · Industrias Pico</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1114;color:#f1f2f4;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px;text-align:center}
  .caja{max-width:440px}
  h1{font-size:24px;margin:0 0 8px}
  h1 span{color:#e0323a}
  p{color:#9aa0a8;margin:0 0 6px}
  .linea{height:3px;width:64px;background:#C21E26;margin:18px auto}
</style>
</head>
<body>
  <div class="caja">
    <h1>Industrias <span>Pico</span></h1>
    <p>Visores 3D de proyectos para instaladores</p>
    <div class="linea"></div>
    <p>Escanea el código QR de tu proyecto para ver su modelo 3D.</p>
    <p>Si el QR no abre, pide al Departamento de Diseño uno actualizado.</p>
  </div>
</body>
</html>
